# Alembic configuration for Ascend.
# The actual connection string is taken from app.core.config at runtime
# (see migrations/env.py), so this value is only a fallback.

[alembic]
script_location = migrations
prepend_sys_path = backend
sqlalchemy.url = sqlite:///./ascend.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
